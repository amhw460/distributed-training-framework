name: Data preparation correctness

on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare_data.py"
      - "tests/test_prepare_data.py"
      - ".github/workflows/test-data-preparation.yml"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install datasets pyarrow
      - name: Test 100 synthetic documents and edge cases
        run: python -m unittest tests.test_prepare_data -v
      - name: Smoke test 100 real FineWeb documents
        run: python -m scripts.prepare_data --max-documents 100 --output-dir "$RUNNER_TEMP/fineweb-100"
      - name: Verify real dataset manifest and parquet files
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pyarrow.parquet as pq
          root = Path(os.environ["RUNNER_TEMP"]) / "fineweb-100"
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["stats"]["processed"] == 100
          assert manifest["stats"]["kept"] > 0
          assert sum(s["documents"] for s in manifest["shards"]) == manifest["stats"]["kept"]
          assert all(pq.read_table(root / s["file"]).num_rows == s["documents"] for s in manifest["shards"])
          print("PASS: real FineWeb sample written and verified")
          PY
