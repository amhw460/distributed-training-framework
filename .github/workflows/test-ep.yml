name: Expert parallel correctness

on:
  push:
    paths:
      - "framework/expertparallel.py"
      - "framework/models/**"
      - "framework/training/trainer.py"
      - "scripts/pretrain.py"
      - "tests/test_full_ep.py"
      - ".github/workflows/test-ep.yml"
  workflow_dispatch:

jobs:
  test-ep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test EP at 1, 2 and 3 ranks
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=1 -m tests.test_full_ep
          torchrun --standalone --nproc-per-node=2 -m tests.test_full_ep
          torchrun --standalone --nproc-per-node=3 -m tests.test_full_ep
      - name: Smoke test Qwen3-MoE training with EP
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=2 -m scripts.pretrain --parallelism ep --synthetic --steps 2 --num-layers 2 --experts 4 --global-batch-size 8
