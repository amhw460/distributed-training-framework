name: Python syntax checks

on:
  push:
    branches: [main]
    paths:
      - "framework/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-python-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q framework scripts tests
      - name: Run data cleaning tests
        run: python -m unittest tests.test_cleaning -v
