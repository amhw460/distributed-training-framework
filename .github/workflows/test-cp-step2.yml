name: Context parallel correctness

on:
  push:
    branches:
      - cp-step2-validation
  workflow_dispatch:

jobs:
  test-cp-step2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test CP forward, backward and optimizer at 1, 2 and 3 ranks
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=1 -m tests.test_cp_gqa
          torchrun --standalone --nproc-per-node=2 -m tests.test_cp_gqa
          torchrun --standalone --nproc-per-node=3 -m tests.test_cp_gqa
      - name: Test full CP training against dense reference
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=1 -m tests.test_cp_training
          torchrun --standalone --nproc-per-node=2 -m tests.test_cp_training
          torchrun --standalone --nproc-per-node=3 -m tests.test_cp_training
      - name: Smoke test CP training entrypoint
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=2 -m scripts.pretrain --parallelism cp --synthetic --steps 2 --seq-len 16 --local-batch-size 2 --global-batch-size 4
