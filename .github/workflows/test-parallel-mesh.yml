name: Hybrid device mesh correctness

on:
  push:
    branches:
      - hybrid-mesh
    paths:
      - "framework/parallel_mesh.py"
      - "tests/test_parallel_mesh.py"
      - ".github/workflows/test-parallel-mesh.yml"
  workflow_dispatch:

jobs:
  test-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test singleton mesh
        run: torchrun --standalone --nproc-per-node=1 -m tests.test_parallel_mesh
      - name: Test DP × TP
        run: torchrun --standalone --nproc-per-node=4 -m tests.test_parallel_mesh --dp 2 --tp 2
      - name: Test PP × CP × EP
        run: torchrun --standalone --nproc-per-node=8 -m tests.test_parallel_mesh --pp 2 --cp 2 --ep 2
      - name: Test FSDP × TP
        run: torchrun --standalone --nproc-per-node=4 -m tests.test_parallel_mesh --fsdp 2 --tp 2
