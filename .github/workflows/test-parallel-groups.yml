name: Hybrid subgroup communication correctness

on:
  push:
    branches:
      - hybrid-mesh
    paths:
      - "framework/**"
      - "tests/test_parallel_groups.py"
      - ".github/workflows/test-parallel-groups.yml"
  workflow_dispatch:

jobs:
  subgroups:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test independent groups for all six strategies
        env:
          OMP_NUM_THREADS: "1"
        run: |
          for mode in dp tp fsdp cp ep pp; do
            torchrun --standalone --nproc-per-node=4 -m tests.test_parallel_groups --mode "$mode"
          done
