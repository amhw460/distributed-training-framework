name: Tensor-parallel correctness

on:
  push:
    paths:
      - "framework/**"
      - "tests/test_full_tp.py"
      - "tests/test_parameter_variations.py"
      - "scripts/pretrain_tp.py"
      - ".github/workflows/test-tp.yml"
  workflow_dispatch:

jobs:
  test-tp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run two-rank TP correctness test
        env:
          OMP_NUM_THREADS: "1"
        run: torchrun --standalone --nproc-per-node=2 -m tests.test_full_tp
      - name: Smoke test TP training entry point
        env:
          OMP_NUM_THREADS: "1"
        run: torchrun --standalone --nproc-per-node=2 -m scripts.pretrain_tp --synthetic --steps 2
      - name: Test parameter variations across rank counts and modes
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=1 -m tests.test_parameter_variations --mode tp
          torchrun --standalone --nproc-per-node=3 -m tests.test_parameter_variations --mode tp
          torchrun --standalone --nproc-per-node=4 -m tests.test_parameter_variations --mode tp
          torchrun --standalone --nproc-per-node=3 -m tests.test_parameter_variations --mode fsdp
          torchrun --standalone --nproc-per-node=3 -m tests.test_parameter_variations --mode ddp
