name: Tensor-parallel correctness

on:
  push:
    paths:
      - "framework/**"
      - "tests/test_full_tp.py"
      - "tests/test_parameter_variations.py"
      - "scripts/pretrain_tp.py"
      - "scripts/pretrain.py"
      - ".github/workflows/test-tp.yml"
  workflow_dispatch:

jobs:
  test-tp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run two-rank TP correctness test
        env:
          OMP_NUM_THREADS: "1"
        run: torchrun --standalone --nproc-per-node=2 -m tests.test_full_tp
      - name: Smoke test TP training entry point
        env:
          OMP_NUM_THREADS: "1"
        run: torchrun --standalone --nproc-per-node=2 -m scripts.pretrain_tp --synthetic --steps 2
      - name: Test parameter variations across rank counts and modes
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=1 -m tests.test_parameter_variations --mode tp
          for attempt in $(seq 1 8); do
            echo "Three-rank TP regression attempt $attempt/8"
            torchrun --standalone --nproc-per-node=3 -m tests.test_parameter_variations --mode tp
          done
          torchrun --standalone --nproc-per-node=4 -m tests.test_parameter_variations --mode tp
          torchrun --standalone --nproc-per-node=3 -m tests.test_parameter_variations --mode fsdp
          torchrun --standalone --nproc-per-node=3 -m tests.test_parameter_variations --mode ddp
      - name: Test configurable TP CLI on 3 ranks
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=3 -m scripts.pretrain_tp --synthetic --steps 2 --num-layers 3 --dim 20 --moe-inter-dim 14 --num-heads 6 --num-kv-heads 3 --head-dim 4 --experts 5 --top-k 3 --seq-len 7 --local-batch-size 3 --global-batch-size 9 --vocab-size 53
      - name: Test configurable DDP and FSDP entry points
        env:
          OMP_NUM_THREADS: "1"
        run: |
          torchrun --standalone --nproc-per-node=3 -m scripts.pretrain --parallelism fsdp --synthetic --steps 2 --num-layers 1 --dim 20 --moe-inter-dim 14 --num-heads 6 --num-kv-heads 3 --head-dim 4 --experts 5 --top-k 3 --seq-len 7 --local-batch-size 2 --global-batch-size 12 --vocab-size 53
          torchrun --standalone --nproc-per-node=3 -m scripts.pretrain --parallelism ddp --synthetic --steps 2 --num-layers 1 --dim 20 --moe-inter-dim 14 --num-heads 6 --num-kv-heads 3 --head-dim 4 --experts 5 --top-k 3 --seq-len 7 --local-batch-size 2 --global-batch-size 12 --vocab-size 53
